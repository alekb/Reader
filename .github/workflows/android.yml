name: Android APK and web build

# On every push: run the tests, then build a debug APK and the web bundle on
# GitHub's runners (which have the Android SDK) and upload them as artifacts:
# Actions tab → run → Artifacts.
#
# Main builds are published to the "latest-apk" release; with the signing secrets
# below they are signed with one permanent key so installs can update in place.
#
# Release: run this workflow manually (Actions → "Android APK and web build" →
# Run workflow) or push a tag like v1.0.0. When the signing secrets below are
# set, it also builds a signed Play Store bundle (.aab).
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# One run per branch at a time. A run already going on main is never cancelled
# (cancelling mid-publish could leave the download link empty); newer pushes wait,
# and only the newest waiting one runs.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # Optional: repository secrets that point the builds at a different Firebase
  # project. Unset, the built-in project in src/firebase/config.ts is used.
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Unit and content tests
        run: npm test
      - name: Lint
        run: npm run lint

  apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the "latest-apk" release
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        # The Ubuntu runner ships the SDK and sdkmanager; install what variables.gradle needs.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Build web app
        run: npm run build
      - name: Upload web build (drop the folder on app.netlify.com/drop or deploy with firebase)
        uses: actions/upload-artifact@v4
        with:
          name: reader-quest-web
          path: dist
      - name: Build the app for Android
        run: npm run build && npx cap sync android
        env:
          NATIVE_BUILD: '1'
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: reader-quest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Decode signing key
        # Signs both the self-updating APK and the Play Store bundle. Every published
        # APK must carry the same signature, or Android refuses to update in place.
        id: keystore
        if: env.HAS_KEYSTORE == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      # ---- the sideload channel: https://github.com/<owner>/<repo>/releases/download/latest-apk/reader-quest.apk ----
      - name: Build signed, self-updating APK
        if: github.ref == 'refs/heads/main' && steps.keystore.outputs.path != ''
        run: |
          npm run build
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon
        env:
          NATIVE_BUILD: '1'
          # Turns on the in-app "new version" check (the parent dashboard offers the download).
          VITE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/latest-apk/version.json
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
      # A newer commit reached main while this run was building: let that run publish.
      # Publishing this older commit would put an outdated APK on the download link, and
      # GitHub refuses to move the tag back when main's newer commits changed workflows (403).
      - name: Check this is still the newest commit on main
        id: newest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at ${head::7}; skipping publish of ${GITHUB_SHA::7} (the run for the newer commit publishes)."
          fi
      - name: Publish APK to the "latest-apk" release
        if: steps.newest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keystore.outputs.path != '' }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/latest-apk/reader-quest.apk
          VERSION_CODE: ${{ github.run_number }}
        run: |
          files="reader-quest.apk"
          if [ "$SIGNED" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk reader-quest.apk
            printf '{"versionCode":%s,"versionName":"1.0.%s","apkUrl":"%s"}\n' "$VERSION_CODE" "$VERSION_CODE" "$APK_URL" > version.json
            files="$files version.json"
            notes="Build 1.0.$VERSION_CODE from main at ${GITHUB_SHA::7}. Installed copies update in place and keep the child's progress (Parents → update card)."
          else
            # No signing key configured: each run signs with a throwaway debug key, so
            # installing a newer build requires uninstalling first (which erases progress).
            cp android/app/build/outputs/apk/debug/app-debug.apk reader-quest.apk
            notes="Debug build 1.0.$VERSION_CODE from main at ${GITHUB_SHA::7}. Not signed with a permanent key, so it cannot update an existing install."
          fi
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk $files \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Latest Android build" \
            --notes "$notes Install: download reader-quest.apk on the phone, open it, allow installing from this source."

      # ---- Play Store bundle (manual runs and v* tags). Play updates apps itself, so no self-update check. ----
      - name: Build signed release bundle
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && steps.keystore.outputs.path != ''
        run: |
          npm run build
          npx cap sync android
          cd android && ./gradlew bundleRelease --no-daemon
        env:
          NATIVE_BUILD: '1'
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && steps.keystore.outputs.path != ''
        with:
          name: reader-quest-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
