name: Android APK and web build

# On every push: run the tests, then build a debug APK and the web bundle on
# GitHub's runners (which have the Android SDK) and upload them as artifacts:
# Actions tab → run → Artifacts.
#
# Release: run this workflow manually (Actions → "Android APK and web build" →
# Run workflow) or push a tag like v1.0.0. When the signing secrets below are
# set, it also builds a signed Play Store bundle (.aab).
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

env:
  # Add these as repository secrets (Settings → Secrets and variables → Actions)
  # to bake Firebase cloud sync into the builds. Leave unset for a local-only build.
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Unit and content tests
        run: npm test
      - name: Lint
        run: npm run lint

  apk:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the "latest-apk" release
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        # The Ubuntu runner ships the SDK and sdkmanager; install what variables.gradle needs.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Build web app
        run: npm run build
      - name: Upload web build (drop the folder on app.netlify.com/drop or deploy with firebase)
        uses: actions/upload-artifact@v4
        with:
          name: reader-quest-web
          path: dist
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: reader-quest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # A fixed download link that always serves the newest main build:
      # https://github.com/<owner>/<repo>/releases/download/latest-apk/reader-quest.apk
      - name: Publish APK to the "latest-apk" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk reader-quest.apk
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk reader-quest.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Latest Android build" \
            --notes "Debug APK built from main at ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC'). Install: download reader-quest.apk on the phone, open it, allow installing from this source."

      # ---- signed release bundle (manual runs and v* tags, only when the keystore secret exists) ----
      - name: Decode upload keystore
        id: keystore
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
      - name: Build signed release bundle
        if: steps.keystore.outputs.path != ''
        run: cd android && ./gradlew bundleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: reader-quest-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
